# TSPLIB burma14: 14-Staedte in Burma (Zaw Win) (14 targets).
# Source: https://comopt.ifi.uni-heidelberg.de/software/TSPLIB95/tsp/tspindex.html
# Generated by tools/tsplib_to_config.py from examples/tsplib/burma14.tsp.
# GEO: TSPLIB's latitude / longitude (DDD.MM) used as plain x, y;
# the instance's GEO distances do not apply here.
# Turning radius = 0.4 x mean nearest-neighbour distance (1.362) = 0.54; TSPLIB has none.
# cost_scale 1000 keeps LKH's integers in range; the LB estimate can be at
# most 0.014 too low from rounding.
# Run with:
#     python -m src --config examples/burma14.yml

vehicle:
  turning_radius: 0.54

points:
  - [16.470, 96.100]
  - [16.470, 94.440]
  - [20.090, 92.540]
  - [22.390, 93.370]
  - [25.230, 97.240]
  - [22.000, 96.050]
  - [20.470, 97.020]
  - [17.200, 96.290]
  - [16.300, 97.380]
  - [14.050, 98.120]
  - [16.530, 97.380]
  - [21.520, 95.590]
  - [19.410, 97.130]
  - [20.090, 94.550]

heading_offset_deg: 0.0
parallelise: true

upper_bound:
  enabled: true
  num_headings: 6
  solver: lkh

lower_bound:
  enabled: true
  num_intervals: 6
  solver: lkh

refinement:
  enabled: true
  lambda: 1
  gap_target: 3.0

solver:
  lkh_runs: 1
  cost_scale: 1000

output:
  plot: true
